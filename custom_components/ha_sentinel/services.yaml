check_now:
  name: Check Now
  description: Fetch available updates and evaluate policy without installing.

install_now:
  name: Install Now
  description: Admin only. Install a specific update by slug now, bypassing dry-run and the stability delay. The blocklist and pre-update backup are still enforced.
  fields:
    slug:
      name: Slug
      description: The slug identifier of the update to install.
      required: true
      example: core_ssh
      selector:
        text:
    provider:
      name: Provider
      description: Optional provider to disambiguate the slug.
      required: false
      selector:
        select:
          options:
            - core
            - addon
            - hacs

dismiss:
  name: Dismiss Notification
  description: Dismiss the HA Sentinel summary notification.
